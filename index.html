<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="theme-color" content="#CC9B62"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>هٌل واژه - بارگذاری</title><script src="transitions.js"></script><script src="https://developer.eitaa.com/eitaa-web-app.js"></script><style>*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none!important;outline:0!important;margin:0;padding:0;box-sizing:border-box}@font-face{font-family:Vazirmatn;src:url('assets/fonts/Vazirmatn-Medium.ttf') format('truetype')}body,html{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}html{background-color:#cc9b62!important}body{background:url('assets/container-bg.webp') center/cover no-repeat #2c1e16;font-family:Vazirmatn,sans-serif}.notch-space{width:100%;height:40px;background-color:#000;flex-shrink:0}@media (min-width:551px){.notch-space{display:none}}.overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}.container{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:space-around;align-items:center;height:calc(100vh - 40px);padding:60px 20px 40px}@media (min-width:551px){.container{height:100vh;padding-top:60px}}.top-section{display:flex;justify-content:center;width:100%}.logo{margin-top:-6px;width:19rem;max-width:80%;opacity:0;transform:scale(.95);transition:opacity .8s cubic-bezier(.25, 1, .5, 1),transform .8s cubic-bezier(.25, 1, .5, 1)}.logo.reveal{opacity:1;transform:scale(1)}#splash-tiles-container{display:flex;gap:clamp(6px,2vw,10px);justify-content:center;align-items:center;width:100%}.tile{display:flex;justify-content:center;align-items:center;aspect-ratio:1/1;transform-style:preserve-3d;transform-origin:center center;backface-visibility:hidden;will-change:transform}.tile span{font-size:clamp(1.4rem, 4vw, 1.9rem);pointer-events:none;filter:drop-shadow(1px 1px 1px rgba(255, 255, 255, .4))}.tile.correct{background-image:url('assets/tile-correct-bg.webp')!important;background-size:cover;color:#103306!important;text-shadow:-1px -1px 2px rgba(0,0,0,.5),1px 1px 1px rgba(255,255,255,.4)}.tile.newly-correct{animation:.5s cubic-bezier(.175,.885,.32,1.275) forwards correctPulse}@keyframes correctPulse{0%,100%{transform:scale(1) translateZ(0)}50%{transform:scale(1.15) translateZ(0);box-shadow:0 0 15px rgba(76,175,80,.6)}}.bottom-section{display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;min-height:60px}.physical-progressbar{box-shadow:inset 0 4px 8px rgba(0,0,0,.9),0 1px 1px rgba(255,255,255,.1);display:flex;align-items:center;width:160px;height:36px;border:2px solid #3e2723;box-shadow:inset 4px 4px 10px rgba(0,0,0,.8),0 1px 1px rgba(255,255,255,.1);overflow:hidden;display:flex;align-items:center;background:url('assets/board-bg.webp') center/cover;border-radius:6px;padding:4px;display:flex;gap:2px;position:relative;box-shadow:0 6px 12px rgba(0,0,0,.6),inset 0 1px 2px rgba(255,255,255,.2);transition:opacity .4s}#splash-tiles-container{display:flex;justify-content:center;align-items:center}.bottom-section{display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%}.empty-slot{width:28px;height:28px;background:rgba(0,0,0,.15);box-shadow:inset 3px 3px 8px rgba(0,0,0,.8);border-radius:2px}.loading-slider-tile{width:28px;height:28px;background-image:url('assets/tile-bg.webp');background-size:cover;background-position:center;border-radius:2px;position:absolute;left:4px;top:2px;animation:2.5s ease-in-out infinite alternate tileGridSlide;will-change:transform}@keyframes tileGridSlide{0%,10%{transform:translateX(0)}20%,35%{transform:translateX(30px)}45%,60%{transform:translateX(60px)}70%,85%{transform:translateX(90px)}100%,95%{transform:translateX(120px)}}.middle-section{display:flex;flex-direction:column;justify-content:start;margin-bottom:50px;align-items:center;width:100%;min-height:150px}#splash-tiles-container{display:flex;gap:2px;justify-content:center;align-items:center;transition:opacity .5s ease-out;background:url('assets/board-bg.webp') center/cover #1a0f07;padding:4px;border-radius:6px;box-shadow:inset 0 4px 10px rgba(0,0,0,.8),0 10px 20px rgba(0,0,0,.5);width:fit-content;margin:0 auto;position:relative}.splash-slot{width:clamp(48px,13vw,62px);aspect-ratio:1/1;background:rgba(0,0,0,.15);box-shadow:inset 3px 3px 8px rgba(0,0,0,.8);border-radius:2px;display:flex;justify-content:center;align-items:center}.tile{display:flex;justify-content:center;align-items:center;width:clamp(48px,13vw,62px);aspect-ratio:1/1;background-image:url('assets/tile-bg.webp');background-size:cover;background-position:center;color:#4a2600;font-weight:900;position:relative;transform-style:preserve-3d;transform-origin:center center;backface-visibility:hidden;will-change:transform;transform:translateZ(0);transition:transform 180ms cubic-bezier(.2, .8, .2, 1);border-radius:2px}#startGameBtn{padding:12px 35px;font-size:1.3rem;font-family:Vazirmatn,sans-serif;background:url('assets/panel.webp') center/cover #381c0b;color:#ffeedb;text-shadow:1px 1px 2px rgba(0,0,0,.8);border:2px solid #3e2723;border-radius:8px;cursor:pointer;box-shadow:inset 0 2px 5px rgba(255,255,255,.2),0 6px 12px rgba(0,0,0,.6);transition:.4s cubic-bezier(.34, 1.56, .64, 1);opacity:0;visibility:hidden;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9)}#startGameBtn.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}#restoreFullscreenBtn{display:none;position:fixed;top:20px;right:20px;z-index:99999;padding:10px 15px;font-size:1rem;font-family:Vazirmatn,sans-serif;background-color:rgba(0,0,0,.7);color:#fff;border:2px solid rgba(255,255,255,.5);border-radius:8px;cursor:pointer;backdrop-filter:blur(4px);transition:.3s}#restoreFullscreenBtn:hover{background-color:rgba(0,0,0,.9);border-color:#fff;transform:scale(1.05)}</style></head><body><div class="notch-space"></div><div class="overlay"></div><div class="container"><header class="top-section"><img src="assets/logo.webp" alt="لوگوی بازی هٌل واژه" class="logo" id="splash-logo"></header><section class="middle-section"><div id="splash-tiles-container"><div class="splash-slot"><div class="tile" data-index="0"><span>هـ</span></div></div><div class="splash-slot"><div class="tile" data-index="1"><span>ل</span></div></div><div class="splash-slot"><div class="tile" data-index="2"><span>و</span></div></div><div class="splash-slot"><div class="tile" data-index="3"><span>ا</span></div></div><div class="splash-slot"><div class="tile" data-index="4"><span>ژ</span></div></div><div class="splash-slot"><div class="tile" data-index="5"><span>ه</span></div></div></div></section><footer class="bottom-section"><div class="physical-progressbar" id="loading-bar" aria-label="در حال بارگذاری"><div class="empty-slot"></div><div class="empty-slot"></div><div class="empty-slot"></div><div class="empty-slot"></div><div class="empty-slot"></div><div class="loading-slider-tile"></div></div></footer></div><button id="restoreFullscreenBtn">⛶&nbsp;تمام‌صفحه</button><script src="assets/js/crypto-js.min.js"></script><script src="security.js"></script><script src="audio.js"></script><script src="index.js"></script><script src="security-source.js"></script></body></html>
